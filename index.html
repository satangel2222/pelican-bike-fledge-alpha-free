<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车 - fledge-alpha-free</title>
<style>
  body { margin: 0; background: #87CEEB; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  svg { width: 100vw; height: 100vh; }

  /* 整辆车左右行驶 */
  .ride { animation: rideAcross 8s linear infinite; }
  @keyframes rideAcross {
    0%   { transform: translateX(-300px); }
    100% { transform: translateX(1100px); }
  }

  /* 车轮旋转 */
  .wheel { animation: spin 1s linear infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* 飞轮/脚踏旋转 */
  .crank { animation: spin 1s linear infinite; transform-origin: center; transform-box: fill-box; }

  /* 腿的脚踏动作改用 SMIL（见下方 line 元素） */

  /* 翅膀扇动 */
  .wing { animation: flap 0.6s ease-in-out infinite alternate; transform-origin: 420px 260px; }
  @keyframes flap { from { transform: rotate(-8deg); } to { transform: rotate(18deg); } }

  /* 身体轻微颠簸 */
  .body-bob { animation: bob 0.5s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-4px); } }

  /* 云朵飘动 */
  .cloud1 { animation: cloudMove 12s linear infinite; }
  .cloud2 { animation: cloudMove 18s linear infinite; }
  @keyframes cloudMove { from { transform: translateX(900px); } to { transform: translateX(-300px); } }

  /* 太阳缓缓转 */
  .sun { animation: sunSpin 10s linear infinite; transform-origin: 700px 90px; }
  @keyframes sunSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* 地面滚动感（虚线） */
  .road-dash { animation: dashMove 0.8s linear infinite; }
  @keyframes dashMove { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -60; } }
</style>
</head>
<body>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 天空 -->
  <rect width="800" height="600" fill="#87CEEB"/>

  <!-- 太阳 -->
  <g class="sun">
    <circle cx="700" cy="90" r="35" fill="#FFD93B"/>
    <g stroke="#FFD93B" stroke-width="5" stroke-linecap="round">
      <line x1="700" y1="35" x2="700" y2="15"/>
      <line x1="700" y1="145" x2="700" y2="165"/>
      <line x1="645" y1="90" x2="625" y2="90"/>
      <line x1="755" y1="90" x2="775" y2="90"/>
      <line x1="661" y1="51" x2="647" y2="37"/>
      <line x1="739" y1="129" x2="753" y2="143"/>
      <line x1="739" y1="51" x2="753" y2="37"/>
      <line x1="661" y1="129" x2="647" y2="143"/>
    </g>
  </g>

  <!-- 云朵 -->
  <g class="cloud1" fill="#FFFFFF" opacity="0.9">
    <ellipse cx="200" cy="80" rx="40" ry="20"/>
    <ellipse cx="235" cy="70" rx="30" ry="18"/>
    <ellipse cx="165" cy="72" rx="25" ry="15"/>
  </g>
  <g class="cloud2" fill="#FFFFFF" opacity="0.8">
    <ellipse cx="500" cy="140" rx="35" ry="16"/>
    <ellipse cx="530" cy="132" rx="25" ry="14"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="480" width="800" height="120" fill="#8FBC5A"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#6B8E3B" stroke-width="3"/>
  <line class="road-dash" x1="0" y1="560" x2="800" y2="560" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="30 30"/>

  <!-- 骑车整体 -->
  <g class="ride">
    <!-- 后轮 -->
    <g class="wheel" style="transform-origin: 350px 430px;">
      <circle cx="350" cy="430" r="45" fill="none" stroke="#333" stroke-width="6"/>
      <g stroke="#999" stroke-width="3">
        <line x1="350" y1="385" x2="350" y2="475"/>
        <line x1="305" y1="430" x2="395" y2="430"/>
        <line x1="318" y1="398" x2="382" y2="462"/>
        <line x1="382" y1="398" x2="318" y2="462"/>
      </g>
    </g>
    <!-- 前轮 -->
    <g class="wheel" style="transform-origin: 510px 430px;">
      <circle cx="510" cy="430" r="45" fill="none" stroke="#333" stroke-width="6"/>
      <g stroke="#999" stroke-width="3">
        <line x1="510" y1="385" x2="510" y2="475"/>
        <line x1="465" y1="430" x2="555" y2="430"/>
        <line x1="478" y1="398" x2="542" y2="462"/>
        <line x1="542" y1="398" x2="478" y2="462"/>
      </g>
    </g>

    <!-- 车架 -->
    <g stroke="#E63946" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="350" y1="430" x2="430" y2="330"/>
      <line x1="430" y1="330" x2="500" y2="330"/>
      <line x1="430" y1="330" x2="510" y2="430"/>
      <line x1="350" y1="430" x2="450" y2="430"/>
      <line x1="450" y1="430" x2="510" y2="430"/>
      <line x1="500" y1="330" x2="510" y2="430"/>
    </g>
    <!-- 车把 -->
    <line x1="500" y1="330" x2="495" y2="290" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="480" y1="290" x2="515" y2="290" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <!-- 车座 -->
    <line x1="430" y1="330" x2="425" y2="310" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="425" cy="306" rx="16" ry="6" fill="#333"/>

    <!-- 脚踏 -->
    <g class="crank" style="transform-origin: 430px 430px;">
      <circle cx="430" cy="430" r="10" fill="#555"/>
      <line x1="430" y1="430" x2="430" y2="455" stroke="#555" stroke-width="5"/>
      <rect x="420" y="453" width="20" height="8" rx="3" fill="#333"/>
    </g>

    <!-- 鹈鹕身体 -->
    <g class="body-bob">
      <!-- 腿（脚沿曲柄圆周运动） -->
      <line class="leg1" x1="430" y1="330" x2="455" y2="430" stroke="#F4A261" stroke-width="9" stroke-linecap="round">
        <animate attributeName="x2" values="455;430;405;430;455" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="430;455;430;405;430" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
      </line>
      <line class="leg2" x1="430" y1="330" x2="405" y2="430" stroke="#E76F51" stroke-width="9" stroke-linecap="round">
        <animate attributeName="x2" values="405;430;455;430;405" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="430;405;430;455;430" keyTimes="0;0.25;0.5;0.75;1" dur="1s" repeatCount="indefinite"/>
      </line>

      <!-- 身体 -->
      <ellipse cx="425" cy="265" rx="55" ry="40" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
      <!-- 尾巴 -->
      <path d="M 375 260 L 340 245 L 375 280 Z" fill="#F0F0F0" stroke="#DDD" stroke-width="2"/>
      <!-- 翅膀 -->
      <path class="wing" d="M 420 250 Q 380 220 350 235 Q 390 260 415 265 Z" fill="#E8E8E8" stroke="#CCC" stroke-width="2"/>

      <!-- 脖子 -->
      <path d="M 465 250 Q 475 210 480 195" stroke="#FFFFFF" stroke-width="22" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="483" cy="185" r="18" fill="#FFFFFF" stroke="#DDD" stroke-width="2"/>
      <!-- 眼睛 -->
      <circle cx="489" cy="180" r="3.5" fill="#333"/>
      <!-- 长喙 + 喉囊 -->
      <path d="M 500 183 L 545 190 L 500 197 Z" fill="#F4A261"/>
      <path d="M 500 193 Q 525 215 545 190 Z" fill="#F4A261" opacity="0.85"/>
    </g>
  </g>
</svg>
</body>
</html>
